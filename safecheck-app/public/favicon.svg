<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="45%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#0d9488"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.08"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Full-bleed background so iOS rounds corners cleanly without black borders -->
  <rect width="512" height="512" fill="url(#bgGrad)"/>

  <!-- Subtle glow aura behind shield -->
  <circle cx="256" cy="245" r="160" fill="#34d399" opacity="0.2"/>

  <!-- Inner shield shape -->
  <path d="M256 100 C336 100 380 132 380 132 C380 270 296 362 256 392 C216 362 132 270 132 132 C132 132 176 100 256 100 Z"
        fill="url(#shieldGrad)" stroke="#ffffff" stroke-width="16" stroke-linejoin="round" filter="url(#glow)"/>

  <!-- Crisp checkmark -->
  <path d="M204 246 L242 284 L314 196"
        fill="none" stroke="#ffffff" stroke-width="28" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
</svg>